#textdomain wesnoth-Dominion_War_Wesnoth
# The Dominion War: a Star Trek add-on for Wesnoth 1.18.
# Multiplayer era with four factions. First playable build: placeholder weapon effects.

[textdomain]
    name="wesnoth-Dominion_War_Wesnoth"
    path="data/add-ons/Dominion_War_Wesnoth/translations"
[/textdomain]

# Sprites live under images/ (copied from sprites/roster/).
[binary_path]
    path=data/add-ons/Dominion_War_Wesnoth
[/binary_path]

# Macros used by the unit types: shield profiles, abilities, weapon specials, crew levels
# and traits, attack animations.
{~add-ons/Dominion_War_Wesnoth/utils}

# ---------------------------------------------------------------------------
# Terrain include point.
# The space tileset goes in terrain/, with its own terrain/_main.cfg (terrain
# types, terrain graphics, editor groups). It loads in every mode, because the
# map editor needs it as much as multiplayer does. Until that folder exists this
# block is skipped.
# ---------------------------------------------------------------------------
#ifhave ~add-ons/Dominion_War_Wesnoth/terrain/_main.cfg
{~add-ons/Dominion_War_Wesnoth/terrain}
#endif

# Interface icons (dilithium for gold), only in games with the Dominion War era.
{~add-ons/Dominion_War_Wesnoth/ui}

#ifdef MULTIPLAYER
[units]
    {~add-ons/Dominion_War_Wesnoth/units/movetypes.cfg}
    {~add-ons/Dominion_War_Wesnoth/units/races.cfg}
    {~add-ons/Dominion_War_Wesnoth/units/federation.cfg}
    {~add-ons/Dominion_War_Wesnoth/units/klingon.cfg}
    {~add-ons/Dominion_War_Wesnoth/units/dominion.cfg}
    {~add-ons/Dominion_War_Wesnoth/units/maquis.cfg}
[/units]

{~add-ons/Dominion_War_Wesnoth/era/era.cfg}
#endif
