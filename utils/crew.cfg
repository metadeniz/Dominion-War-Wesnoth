#textdomain wesnoth-Dominion_War_Wesnoth

# Crew levels and crew traits, from design/unit-stats.md, section 1 (Levels and XP, Crew traits).
#
# Every ship keeps its Wesnoth level (0 or 1). The crew levels are after-max-level advancements:
#   Green -> Veteran  at the ship's own XP figure: +20% HP, +1 damage on every attack, +5% defence
#   Veteran -> Elite  at twice that figure: +40% HP in all, +2 damage, +10% defence, and one extra
#                     strike on the main weapon
#   Elite -> Legendary at 150 XP, then again every time: +3 HP and a full repair, like Wesnoth's AMLA

#define DW_CREW_DEFENCE_BONUS
    [effect]
        apply_to=defense
        replace=no
        [defense]
            flat=-5
            forest=-5
            hills=-5
            mountains=-5
            village=-5
            castle=-5
            swamp_water=-5
            shallow_water=-5
            deep_water=-5
            reef=-5
            sand=-5
            frozen=-5
            cave=-5
            fungus=-5
            unwalkable=-5
            impassable=-5
        [/defense]
    [/effect]
#enddef

# ELITE_XP: XP from Veteran to Elite. LEGEND_XP_INCREASE: what to add to ELITE_XP to reach 150.
# MAIN_WEAPON: the attack name that gets the Elite crew's extra strike.
#define DW_CREW_LEVELS ELITE_XP LEGEND_XP_INCREASE MAIN_WEAPON
    [advancement]
        id=dw_veteran
        max_times=1
        major_amla=yes
        always_display=yes
        description= _ "Veteran crew: +20% HP, +1 damage, +5% defence"
        image=misc/dw-veteran-icon.png
        [effect]
            apply_to=hitpoints
            increase_total=20%
            heal_full=yes
        [/effect]
        [effect]
            apply_to=attack
            increase_damage=1
        [/effect]
        {DW_CREW_DEFENCE_BONUS}
        [effect]
            apply_to=max_experience
            increase=100%
        [/effect]
        [effect]
            apply_to=overlay
            add=misc/dw-veteran.png
        [/effect]
    [/advancement]
    [advancement]
        id=dw_elite
        max_times=1
        major_amla=yes
        always_display=yes
        require_amla=dw_veteran
        description= _ "Elite crew: +HP, +1 damage, +5% defence, one more strike with the main weapon"
        image=misc/dw-elite-icon.png
        [effect]
            apply_to=hitpoints
            increase_total=17%
            heal_full=yes
        [/effect]
        [effect]
            apply_to=attack
            increase_damage=1
        [/effect]
        [effect]
            apply_to=attack
            name={MAIN_WEAPON}
            increase_attacks=1
        [/effect]
        {DW_CREW_DEFENCE_BONUS}
        [effect]
            apply_to=max_experience
            increase={LEGEND_XP_INCREASE}
        [/effect]
        [effect]
            apply_to=overlay
            remove=misc/dw-veteran.png
        [/effect]
        [effect]
            apply_to=overlay
            add=misc/dw-elite.png
        [/effect]
    [/advancement]
    [advancement]
        id=dw_legendary
        max_times=-1
        require_amla=dw_veteran,dw_elite
        description= _ "Legendary crew: +3 HP and a full repair"
        image=misc/dw-elite-icon.png
        [effect]
            apply_to=hitpoints
            increase_total=3
            heal_full=yes
        [/effect]
        [effect]
            apply_to=max_experience
            increase=20%
        [/effect]
    [/advancement]
#enddef

# Crew traits. Two random ones per ship (num_traits=2 in units/races.cfg).
#define DW_TRAIT_QUICK
    [trait]
        id=dw_quick
        male_name= _ "quick"
        female_name= _ "female^quick"
        description= _ "Quick: +1 MP, -5% HP"
        [effect]
            apply_to=movement
            increase=1
        [/effect]
        [effect]
            apply_to=hitpoints
            increase_total=-5%
        [/effect]
    [/trait]
#enddef

#define DW_TRAIT_RESILIENT
    [trait]
        id=dw_resilient
        male_name= _ "resilient"
        female_name= _ "female^resilient"
        description= _ "Resilient: +4 HP, +1 HP per level"
        [effect]
            apply_to=hitpoints
            increase_total=4
        [/effect]
        [effect]
            apply_to=hitpoints
            times=per level
            increase_total=1
        [/effect]
    [/trait]
#enddef

#define DW_TRAIT_SHARPSHOOTERS
    [trait]
        id=dw_sharpshooters
        male_name= _ "sharpshooters"
        female_name= _ "female^sharpshooters"
        description= _ "Sharpshooters: +1 damage with torpedoes"
        [effect]
            apply_to=attack
            range=ranged
            increase_damage=1
        [/effect]
    [/trait]
#enddef

#define DW_TRAIT_HARD_CHARGERS
    [trait]
        id=dw_hard_chargers
        male_name= _ "hard chargers"
        female_name= _ "female^hard chargers"
        description= _ "Hard chargers: +1 damage with beams, rams and boarding parties, +1 HP"
        [effect]
            apply_to=attack
            range=melee
            increase_damage=1
        [/effect]
        [effect]
            apply_to=hitpoints
            increase_total=1
        [/effect]
    [/trait]
#enddef

#define DW_TRAIT_SEASONED_OFFICERS
    [trait]
        id=dw_seasoned_officers
        male_name= _ "seasoned officers"
        female_name= _ "female^seasoned officers"
        description= _ "Seasoned officers: 20% less experience needed"
        [effect]
            apply_to=max_experience
            increase=-20%
        [/effect]
    [/trait]
#enddef

#define DW_CREW_TRAITS
    {DW_TRAIT_QUICK}
    {DW_TRAIT_RESILIENT}
    {DW_TRAIT_SHARPSHOOTERS}
    {DW_TRAIT_HARD_CHARGERS}
    {DW_TRAIT_SEASONED_OFFICERS}
#enddef

# Jem'Hadar: always bred for war (no time-of-day penalty), plus one random trait.
#define DW_TRAIT_BRED_FOR_WAR
    [trait]
        id=dw_bred_for_war
        availability=musthave
        male_name= _ "bred for war"
        female_name= _ "female^bred for war"
        description= _ "Bred for war: fights at full strength at any time of the star cycle"
        [effect]
            apply_to=fearless
        [/effect]
    [/trait]
#enddef
