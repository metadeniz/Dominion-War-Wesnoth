#textdomain wesnoth-Dominion_War_Wesnoth

# Weapon specials from design/unit-stats.md, section 2.
# Kamikaze and detonate also need the events in era/events.cfg, which destroy the ship afterwards.

#define DW_SPECIAL_FLEET_TACTICS
    [damage]
        id=dw_fleet_tactics
        name= _ "fleet tactics"
        description= _ "When used offensively, this attack deals 50% more damage if an ally of this ship stands on the far side of the target."
        multiply=1.5
        active_on=offense
        [filter_opponent]
            formula="
                enemy_of(self, flanker) and not flanker.petrified
            where
                flanker = unit_at(direction_from(loc, other.facing))
            "
        [/filter_opponent]
    [/damage]
#enddef

#define DW_SPECIAL_TARGETING_LOCK
    [chance_to_hit]
        id=dw_targeting_lock
        name= _ "targeting lock"
        description= _ "When used offensively, this attack always has at least a 60% chance to hit."
        value=60
        cumulative=yes
        active_on=offense
    [/chance_to_hit]
#enddef

#define DW_SPECIAL_ENERGY_DAMPENER
    [slow]
        id=dw_energy_dampener
        name= _ "energy dampener"
        description= _ "The dampener drains the target's power: it is slowed until it ends a turn, dealing half damage and paying double movement costs."
    [/slow]
#enddef

# Boarding through shields: the damage is raised (or lowered) by exactly the target's kinetic
# resistance, so after the engine applies that resistance the target takes the base damage.
#define DW_SPECIAL_TRANSPORTER
    [damage]
        id=dw_transporter
        name= _ "transporter"
        description= _ "When used offensively, the boarding party beams straight through the target's shields: the target's resistance to kinetic damage, good or bad, does not count. It does nothing against ships without a crew, such as the Dreadnought."
        value="(base_value * 100.0 / (100 - defender.resistance.cold))"
        active_on=offense
        [filter_opponent]
            [not]
                ability=dw_machine
            [/not]
        [/filter_opponent]
    [/damage]
#enddef

#define DW_SPECIAL_KAMIKAZE
    [damage]
        id=dw_kamikaze
        name= _ "kamikaze"
        description= _ "Only on attack. The ship rams the target at full impulse: one strike that always hits, for damage equal to this ship's current HP (target resistances still apply). The target cannot fire back, and the ship is destroyed."
        value="(hitpoints)"
        active_on=offense
    [/damage]
    [chance_to_hit]
        id=dw_kamikaze_hit
        value=100
        cumulative=no
        active_on=offense
    [/chance_to_hit]
    [disable]
        id=dw_kamikaze_no_defense
        active_on=defense
    [/disable]
    [disable]
        id=dw_kamikaze_no_return_fire
        apply_to=opponent
        active_on=offense
    [/disable]
#enddef

#define DW_SPECIAL_DETONATE
    [chance_to_hit]
        id=dw_detonate
        name= _ "detonate"
        description= _ "Only on attack. The target fires first: every strike of its best beam, ram or boarding weapon, which the Dreadnought cannot answer. If the Dreadnought survives, the warhead always hits and the Dreadnought is destroyed in the blast."
        value=100
        cumulative=no
        active_on=offense
    [/chance_to_hit]
    [disable]
        id=dw_detonate_no_defense
        active_on=defense
    [/disable]
    [disable]
        id=dw_detonate_no_return_fire
        apply_to=opponent
        active_on=offense
    [/disable]
#enddef

#define DW_SPECIAL_CHARGE
    [damage]
        id=dw_charge
        name= _ "charge"
        description= _ "When used offensively, this attack deals double damage to the target. It also causes this ship to take double damage from the target's counterattack."
        multiply=2
        apply_to=both
        active_on=offense
    [/damage]
#enddef

# The resistance drop itself is given in era/events.cfg (an [object] lasting until the target's
# next turn).
#define DW_SPECIAL_SHIELD_BREAKER
    [dummy]
        id=dw_shield_breaker
        name= _ "shield breaker"
        description= _ "If this attack hits at least once, the target's shields are knocked down: all its resistances drop by 20 points until its next turn. It does not stack."
    [/dummy]
#enddef
