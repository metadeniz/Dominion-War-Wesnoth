#textdomain wesnoth-Dominion_War_Wesnoth

# Ship abilities from design/unit-stats.md, section 2.
# Abilities the engine has no tag for ([dummy]) work through the events in era/events.cfg
# or through terrain overrides in the unit type (DW_DARK_MATTER_ADEPT, DW_BADLANDS_PILOTS).

# Terrain codes used by the cloaks. Space terrain (Z codes, terrain/terrain.cfg) and the
# plain Wesnoth terrain they stand for, so the cloaks work with or without the space terrain.
#define DW_TERRAIN_NEBULA_BADLANDS
*^Zf,*^Zfa,*^F*,Zb,Zbd,Zbs,Ss,Sm,Ws*,Wd*,Wo*
#enddef

#define DW_TERRAIN_DARK_MATTER
Zt,*^Zt,*^Zto,T*,*^T*,*^Uf*
#enddef

#define DW_ABILITY_CLOAK
    [hides]
        id=dw_cloak
        name= _ "cloak"
        description= _ "This ship carries a cloaking device. Enemy ships cannot see it, except when they are next to it. An enemy ship that finds it loses all its remaining movement. Attacking reveals the ship until its next turn. No cloak works in a dark matter nebula."
        affect_self=yes
        [filter]
            [filter_location]
                [not]
                    terrain={DW_TERRAIN_DARK_MATTER}
                [/not]
            [/filter_location]
        [/filter]
    [/hides]
#enddef

#define DW_ABILITY_NEBULA_CLOAK
    [hides]
        id=dw_nebula_cloak
        name= _ "nebula cloak"
        description= _ "In a nebula or the Badlands this ship hides in the gas. Enemy ships cannot see it there, except when they are next to it. An enemy ship that finds it loses all its remaining movement. It does not work in dark matter nebulae."
        affect_self=yes
        [filter]
            [filter_location]
                terrain={DW_TERRAIN_NEBULA_BADLANDS}
            [/filter_location]
        [/filter]
    [/hides]
#enddef

#define DW_ABILITY_REPAIRS
    [heals]
        id=dw_repairs
        value=4
        max_value=8
        name= _ "repairs +4"
        description= _ "Engineering teams repair adjacent allied ships: each recovers 4 HP at the start of its turn. A ship under repair by several ships recovers at most 8 HP a turn. Jem'Hadar ships can't be repaired this way."
        affect_self=no
        affect_allies=yes
        poison=slowed
        [affect_adjacent]
            [filter]
                [not]
                    ability=dw_ketracel_dependent
                [/not]
            [/filter]
        [/affect_adjacent]
    [/heals]
#enddef

# Command: like Wesnoth leadership, but it also helps ships of the same crew level.
#define DW_ABILITY_COMMAND
    [leadership]
        id=dw_command
        value="(25 * (1 + level - other.level))"
        cumulative=no
        name= _ "command"
        description= _ "Adjacent allied ships of the same or a lower crew level deal 25% more damage, and 25% more again for each level below this ship. Machines without a crew, such as the Dreadnought, cannot be commanded."
        affect_self=no
        [affect_adjacent]
            [filter]
                formula="level <= other.level"
                [not]
                    ability=dw_machine
                [/not]
            [/filter]
        [/affect_adjacent]
    [/leadership]
#enddef

#define DW_ABILITY_EVASIVE
    [skirmisher]
        id=dw_evasive
        name= _ "evasive"
        description= _ "This ship is quick and nimble enough to slip past enemy ships, and ignores all enemy zones of control."
        affect_self=yes
    [/skirmisher]
#enddef

#define DW_ABILITY_GLORY
    [dummy]
        id=dw_glory
        name= _ "glory"
        description= _ "A Klingon crew fights harder after a victory: this ship regains 8 HP when it destroys an enemy ship."
    [/dummy]
#enddef

#define DW_ABILITY_PLUNDER
    [dummy]
        id=dw_plunder
        name= _ "plunder"
        description= _ "When this ship destroys an enemy ship, its side salvages 3 dilithium from the wreck."
    [/dummy]
#enddef

#define DW_ABILITY_KETRACEL_DEPENDENT
    [dummy]
        id=dw_ketracel_dependent
        name= _ "Ketracel-dependent"
        description= _ "Jem'Hadar crews need Ketracel-white. Jem'Hadar don't help each other: this ship gets no rest repair, and no ship can repair it. It repairs only at planets and stations, where the white is stockpiled."
    [/dummy]
#enddef

#define DW_ABILITY_MACHINE
    [dummy]
        id=dw_machine
        name= _ "machine"
        description= _ "No crew: this ship gains no experience, has no crew traits and cannot be helped by Command."
    [/dummy]
#enddef

#define DW_ABILITY_DARK_MATTER_ADEPT
    [dummy]
        id=dw_dark_matter_adept
        name= _ "dark matter adept"
        description= _ "This crew knows dark matter nebulae well: +10% defence there, and they cost 1 move to enter instead of 2."
    [/dummy]
#enddef

#define DW_ABILITY_BADLANDS_PILOTS
    [dummy]
        id=dw_badlands_pilots
        name= _ "Badlands pilots"
        description= _ "Raised among the plasma storms: +10% defence in nebulae and the Badlands, and the Badlands cost 1 move less to enter."
    [/dummy]
#enddef

# Terrain overrides that go with the two abilities above. Put them in the [unit_type], outside
# [abilities]. Wesnoth stores defence as the chance to be hit, so a lower number is better.
#define DW_DARK_MATTER_ADEPT_TERRAIN FUNGUS_DEFENCE
    [movement_costs]
        fungus=1
    [/movement_costs]
    [defense]
        fungus={FUNGUS_DEFENCE}
    [/defense]
#enddef

#define DW_BADLANDS_PILOTS_TERRAIN
    [movement_costs]
        swamp_water=1
        shallow_water=1
        deep_water=2
    [/movement_costs]
    [defense]
        forest=30
        swamp_water=60
        shallow_water=60
        deep_water=60
    [/defense]
#enddef
