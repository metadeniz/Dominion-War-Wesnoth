#textdomain wesnoth-Dominion_War_Wesnoth

# Placeholder attack animations. The final weapon effects are still being chosen
# (sprites/fx-prototypes in the project library), so these are simple stand-ins:
#   bolt     a beam bolt flies to the target (phasers, disruptors, polaron beams)
#   torpedo  a glowing torpedo flies to the target
#   ram      the ship lunges at the target and back
#   board    a transporter shimmer on the target
# Projectile images are in images/projectiles/dw/ (drawn by tools/make_fx.py).
# Sounds are the GPL set in sounds/free-sci-fi/ (see its CREDITS.md).

#define DW_ANIM_BOLT NAME IMAGE FX SOUND
    [attack_anim]
        [filter_attack]
            name={NAME}
        [/filter_attack]
        missile_start_time=-130
        [missile_frame]
            duration=130
            image="projectiles/dw/{FX}-n.png"
            image_diagonal="projectiles/dw/{FX}-ne.png"
        [/missile_frame]
        start_time=-250
        [frame]
            duration=350
            image={IMAGE}
            sound={SOUND}
        [/frame]
    [/attack_anim]
#enddef

#define DW_ANIM_BOLT_HIT NAME IMAGE FX SOUND HIT
    [attack_anim]
        [filter_attack]
            name={NAME}
        [/filter_attack]
        missile_start_time=-130
        [missile_frame]
            duration=130
            image="projectiles/dw/{FX}-n.png"
            image_diagonal="projectiles/dw/{FX}-ne.png"
        [/missile_frame]
        start_time=-250
        [frame]
            duration=350
            image={IMAGE}
            sound={SOUND}
        [/frame]
        {SOUND:HIT {HIT} 0}
    [/attack_anim]
#enddef

#define DW_ANIM_TORPEDO NAME IMAGE FX SOUND HIT
    [attack_anim]
        [filter_attack]
            name={NAME}
        [/filter_attack]
        missile_start_time=-300
        [missile_frame]
            duration=300
            image="projectiles/dw/{FX}.png"
            image_diagonal="projectiles/dw/{FX}.png"
        [/missile_frame]
        start_time=-400
        [frame]
            duration=500
            image={IMAGE}
            sound={SOUND}
        [/frame]
        {SOUND:HIT {HIT} 0}
    [/attack_anim]
#enddef

#define DW_ANIM_RAM NAME IMAGE HIT
    [attack_anim]
        [filter_attack]
            name={NAME}
        [/filter_attack]
        offset=0.0~0.6:250,0.6~0.0:250
        start_time=-250
        [frame]
            duration=500
            image={IMAGE}
        [/frame]
        {SOUND:HIT {HIT} -20}
    [/attack_anim]
#enddef

#define DW_ANIM_BOARD NAME IMAGE FX HIT
    [attack_anim]
        [filter_attack]
            name={NAME}
        [/filter_attack]
        missile_start_time=-300
        [missile_frame]
            duration=350
            offset=1.0
            image="projectiles/dw/{FX}.png"
            image_diagonal="projectiles/dw/{FX}.png"
            alpha=0.0~1.0:150,1.0~0.0:200
        [/missile_frame]
        start_time=-300
        [frame]
            duration=400
            image={IMAGE}
        [/frame]
        {SOUND:HIT {HIT} 0}
    [/attack_anim]
#enddef

# The ship blows up: an explosion over the hull while it fades out.
#define DW_ANIM_DEATH IMAGE
    [death]
        start_time=0
        [frame]
            duration=800
            image={IMAGE}
            alpha=1.0~0.0:800
            sound=free-sci-fi/impacts/explosion-ship.ogg
        [/frame]
        boom_start_time=0
        [boom_frame]
            duration=800
            halo="projectiles/fireball-impact-[1~16].png:50"
        [/boom_frame]
    [/death]
#enddef
