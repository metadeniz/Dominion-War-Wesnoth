#textdomain wesnoth-Dominion_War_Wesnoth
#ifdef TEST
[binary_path]
    path=data/add-ons/Dominion_War_Wesnoth
[/binary_path]
{~add-ons/Dominion_War_Wesnoth/utils}
[units]
    {~add-ons/Dominion_War_Wesnoth/units/movetypes.cfg}
    {~add-ons/Dominion_War_Wesnoth/units/races.cfg}
    {~add-ons/Dominion_War_Wesnoth/units/federation.cfg}
    {~add-ons/Dominion_War_Wesnoth/units/klingon.cfg}
    {~add-ons/Dominion_War_Wesnoth/units/dominion.cfg}
    {~add-ons/Dominion_War_Wesnoth/units/maquis.cfg}
[/units]
{~add-ons/Dominion_War_Wesnoth/era/events.cfg}
[test]
    id=dw_test
    name="DW test"
    map_data="{multiplayer/maps/2p_The_Freelands.map}"
    turns=-1
    {DW_ERA_EVENTS}
    [side]
        side=1
        controller=human
        type=DW_Galaxy
        canrecruit=yes
        x,y=3,3
    [/side]
    [side]
        side=2
        controller=human
        team_name=b
        type=DW_Vorcha
        canrecruit=yes
        x,y=30,20
    [/side]
    [event]
        name=start
        [lua]
            code=<< wesnoth.dofile("~add-ons/DW_Test/test.lua") >>
        [/lua]
    [/event]
[/test]
