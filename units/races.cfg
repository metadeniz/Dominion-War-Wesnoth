#textdomain wesnoth-Dominion_War_Wesnoth

# Every crew gets two random crew traits (utils/crew.cfg). Jem'Hadar always get Bred for war plus one.
# The Dreadnought (machine) has no crew and no traits.

[race]
    id=dw_federation
    name= _ "Federation"
    plural_name= _ "Federation"
    num_traits=2
    ignore_global_traits=yes
    markov_chain_size=2
    {DW_CREW_TRAITS}
[/race]

