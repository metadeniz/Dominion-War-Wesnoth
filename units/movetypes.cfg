#textdomain wesnoth-Dominion_War_Wesnoth

# Hull classes from design/unit-stats.md, section 1 (Hull classes).
# Space terrains are aliases of Wesnoth terrains (design/space-tileset.md):
#   open space=flat, nebula=forest, asteroids=hills, dense asteroids=mountains,
#   planet=village, starbase=castle, Badlands=swamp/shallow/deep water,
#   wreckage=reef, dust=sand, comet ice=frozen, dim void=cave, dark matter=fungus.
# Values marked 'placeholder' are not in the hull table yet and are guesses
# (based on the nearest terrain the table does cover).

