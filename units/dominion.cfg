[unit_type]
    id=DW_Hideki
    name= _ "Hideki-class"
    race=dw_cardassian
    image="units/dominion/ca-hideki.png"
    level=0
    cost=10
    hitpoints=30
    movement=7
    movement_type=dw_light
    alignment=lawful
    experience=20
    advances_to=null
    description= _ "Cheap Cardassian patrol ship. No torpedoes."
    {DW_SHIELDS_CARDASSIAN}
    [attack]
        name=spiral_disruptor
        description= _ "spiral disruptor"
        icon=attacks/fire-blast.png
        type=blade
        range=melee
        damage=5
        number=3
    [/attack]
    {DW_CREW_LEVELS 40 110 spiral_disruptor}
    {DW_ANIM_BOLT spiral_disruptor "units/dominion/ca-hideki.png" "beam-spiral" "free-sci-fi/phasers/phaser-energy-beam.ogg"}
    {DW_ANIM_DEATH "units/dominion/ca-hideki.png"}
[/unit_type]

