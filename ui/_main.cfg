#textdomain wesnoth-Dominion_War_Wesnoth
# The Dominion War's interface icons: dilithium crystals in place of Wesnoth's gold (top bar, income,
# upkeep, recruit and recall costs) and a planet in place of the village house.
#
# They replace core images of the same name (images/themes/), so they are scoped to games played
# with the Dominion War era: the era sets define=DOMINION_WAR_ERA, and Wesnoth reloads the game
# config with that symbol when such a game starts. Other eras keep their gold.
#
# tools/make_icons.py draws them.

#ifdef DOMINION_WAR_ERA
[binary_path]
    path=data/add-ons/Dominion_War_Wesnoth/ui
[/binary_path]
#endif
