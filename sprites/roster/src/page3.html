    if(x.shadow!==false){ X.castShadow=true; X.shadow.bias=x.bias??-0.0015; X.shadow.normalBias=x.nb??0.03; X.shadow.mapSize.set(x.map||1024,x.map||1024); Object.assign(X.shadow.camera,{left:-3,right:3,top:3,bottom:-3,near:0.1,far:20}); }
    sc.add(X); }
  if(LC.normals) r.outputColorSpace=T.LinearSRGBColorSpace;
  r.render(sc,cam); const shipUrl=r.domElement.toDataURL('image/png');
  r.outputColorSpace=T.SRGBColorSpace;
  if(LC.shipOnly) return shipUrl;   // light passes for compositing: the ship alone on a transparent background
  if(LC.shadowOnly) return shadowUrl;
  const ld=u=>new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.src=u; });
  const [ia,ib]=await Promise.all([ld(shadowUrl),ld(shipUrl)]); const cv=document.createElement('canvas'); cv.width=ia.width; cv.height=ia.height;
  const g=cv.getContext('2d'); g.drawImage(ia,0,0); g.drawImage(ib,0,0); return cv.toDataURL('image/png');
};
window.measure=async(name,hasTex,rot,tint)=>{
  let obj; if(name.startsWith('/dl/')||name.startsWith('/models/')&&!hasTex){ obj=(await loadFile(name, tint)).clone(); } else { obj=(await load(name,hasTex)).clone(); }
  const fix=new T.Group(); fix.add(obj); fix.rotation.set(...rot.map(d=>d*Math.PI/180),'YXZ');
  const norm=new T.Group(); norm.add(fix); norm.updateMatrixWorld(true);
  const bb=new T.Box3().setFromObject(norm), c=bb.getCenter(new T.Vector3()); fix.position.sub(c); norm.updateMatrixWorld(true);
  let rad=0; const v=new T.Vector3();
  norm.traverse(o=>{ if(o.isMesh){ const p=o.geometry.attributes.position, step=Math.max(1,Math.floor(p.count/20000)); for(let i=0;i<p.count;i+=step){ v.fromBufferAttribute(p,i).applyMatrix4(o.matrixWorld); rad=Math.max(rad,Math.hypot(v.x,v.z)); } }});
  const s=bb.getSize(new T.Vector3()); return {lx:s.x, ly:s.y, lz:s.z, rad};
};
window.ready=true;
