#textdomain wesnoth-Dominion_War_Wesnoth
# The Dominion War's space terrain: any standard Wesnoth map, played in space.
#
# Included from the add-on's _main.cfg with {~add-ons/Dominion_War_Wesnoth/terrain}.
# It loads in every mode, so the map editor knows the space terrain too.
#
#   terrain.cfg            the space terrain types (Z codes), each an alias of a Wesnoth terrain
#   terrain-graphics.cfg   how they are drawn (images in images/terrain/dw/)
#   lua/space_terrain.lua  turns a map's Wesnoth terrain into space terrain when a game starts
#   tools/                 the generators: make_terrain.py writes the two .cfg files and the images,
#                          convert_map.py converts a .map file the same way the game does
#
# Design and mapping: design/space-tileset.md.

[binary_path]
    path=data/add-ons/Dominion_War_Wesnoth/terrain
[/binary_path]

{~add-ons/Dominion_War_Wesnoth/terrain/terrain.cfg}
{~add-ons/Dominion_War_Wesnoth/terrain/terrain-graphics.cfg}

# Put this in an [era] (or a [modification]) to turn every map into space when the game starts:
#
#   [era]
#       ...
#       {DW_SPACE_TERRAIN_EVENT}
#   [/era]
#
# It runs once, in prestart, before anything is drawn. Movement and defence stay exactly as on the
# original map, because every space terrain is an alias of the terrain it replaces.
#define DW_SPACE_TERRAIN_EVENT
    [event]
        name=prestart
        id=dw_space_terrain
        [lua]
            code=<<
                local convert = wesnoth.dofile("~add-ons/Dominion_War_Wesnoth/terrain/lua/space_terrain.lua")
                convert()
            >>
        [/lua]
    [/event]
#enddef

# A modification that does the same, for trying the space terrain with any era.
#ifdef MULTIPLAYER
[modification]
    id=dw_space_terrain
    name= _ "Dominion War: space terrain"
    description= _ "Turns any map into space when the game starts: forests become nebulae, hills asteroid fields, water the Badlands, villages planets and castles starbases. Every hex plays exactly as before."
    type=mp
    {DW_SPACE_TERRAIN_EVENT}
[/modification]
#endif
