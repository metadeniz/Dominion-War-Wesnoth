#textdomain wesnoth-Dominion_War_Wesnoth

[era]
    id=DW_Era
    name= _ "The Dominion War"
    description= _ "Four factions of the Dominion War (2373 to 2375): the Federation, the Klingon Empire, the Dominion Alliance and the Maquis. Work in progress: ships have no weapons yet."
    require_era=yes

    {RANDOM_SIDE}
    {~add-ons/Dominion_War_Wesnoth/era/factions}

    # Converts the map to space terrain at prestart. Defined in terrain/_main.cfg,
    # which _main.cfg loads before the era; skipped while that folder is missing.
#ifdef DW_SPACE_TERRAIN_EVENT
    {DW_SPACE_TERRAIN_EVENT}
#endif
[/era]
