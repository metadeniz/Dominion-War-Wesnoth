#textdomain wesnoth-Dominion_War_Wesnoth

# Game rules that the ship abilities need, from design/unit-stats.md, section 2.
# Included in the era, so they run in every Dominion War game.

#define DW_ERA_EVENTS
    # Multiplayer leaders start with a Veteran crew (section 5): give each leader the
    # dw_veteran advancement from its own ship type, so it is never offered again.
    [event]
        name=prestart
        id=dw_veteran_leaders
        [lua]
            code=<<
                for _, u in ipairs(wesnoth.units.find_on_map{ canrecruit = true }) do
                    local ut = wesnoth.unit_types[u.type]
                    if ut then
                        for adv in wml.child_range(ut.__cfg, "advancement") do
                            if adv.id == "dw_veteran" then
                                u:add_modification("advancement", adv)
                                u.hitpoints = u.max_hitpoints
                            end
                        end
                    end
                end
            >>
        [/lua]
    [/event]

    # Glory: a Klingon ship regains 8 HP when it destroys an enemy.
    [event]
        name=die
        id=dw_glory
        first_time_only=no
        [filter_second]
            ability=dw_glory
        [/filter_second]
        [heal_unit]
            [filter]
                x,y=$x2,$y2
            [/filter]
            amount=8
            animate=no
        [/heal_unit]
        [floating_text]
            x,y=$x2,$y2
            text="<span color='#e04040'>" + _ "Glory!" + "</span>"
        [/floating_text]
    [/event]

    # Plunder: +3 dilithium when this ship destroys an enemy.
    [event]
        name=die
        id=dw_plunder
        first_time_only=no
        [filter_second]
            ability=dw_plunder
        [/filter_second]
        [gold]
            side=$second_unit.side
            amount=3
        [/gold]
        [floating_text]
            x,y=$x2,$y2
            text="<span color='#ffd700'>" + _ "+3 dilithium" + "</span>"
        [/floating_text]
    [/event]

    # Kamikaze and the Dreadnought's warhead destroy the attacking ship.
    [event]
        name=attack end
        id=dw_self_destruct
        first_time_only=no
        [filter_attack]
            special_id=dw_kamikaze,dw_detonate
        [/filter_attack]
        [kill]
            x,y=$x1,$y1
            animate=yes
            fire_event=no
        [/kill]
    [/event]

    # Shield breaker (Ferengi EM pulse): a hit knocks the target's resistances down by 20 points
    # until its own next turn. Re-applying replaces the old drop, so it never stacks.
    [event]
        name=attacker hits,defender hits
        id=dw_shield_breaker
        first_time_only=no
        [lua]
            code=<<
                local _ = wesnoth.textdomain "wesnoth-Dominion_War_Wesnoth"
                local ctx = wesnoth.current.event_context
                local hitter, target, weapon
                if ctx.name == "attacker hits" or ctx.name == "attacker_hits" then
                    hitter, target, weapon = wesnoth.units.get(ctx.x1, ctx.y1), wesnoth.units.get(ctx.x2, ctx.y2), wml.get_child(ctx, "weapon")
                else
                    hitter, target, weapon = wesnoth.units.get(ctx.x2, ctx.y2), wesnoth.units.get(ctx.x1, ctx.y1), wml.get_child(ctx, "second_weapon")
                end
                if not (hitter and target and weapon) then return end
                local breaks = false
                for _, a in ipairs(hitter.attacks) do
                    if a.name == weapon.name then
                        for _, sp in ipairs(a.specials) do
                            if sp[2].id == "dw_shield_breaker" then breaks = true end
                        end
                    end
                end
                if not breaks then return end
                target:remove_modifications({ id = "dw_shield_breaker" }, "object")
                target:add_modification("object", {
                    id = "dw_shield_breaker",
                    duration = "turn",
                    wml.tag.effect {
                        apply_to = "resistance",
                        replace = false,
                        wml.tag.resistance { blade = 20, pierce = 20, impact = 20, fire = 20, cold = 20, arcane = 20 },
                    },
                })
                wesnoth.interface.float_label(target.x, target.y, "<span color='#60c0ff'>" .. _"shields down" .. "</span>")
            >>
        [/lua]
    [/event]

    # Dreadnought point defence: before the warhead goes off, the target fires every strike of its
    # best melee weapon at the Dreadnought, which can't answer. If that destroys the Dreadnought,
    # the attack never happens.
    [event]
        name=attack
        id=dw_point_defence
        first_time_only=no
        [filter_attack]
            special_id=dw_detonate
        [/filter_attack]
        [lua]
            code=<<
                local ctx = wesnoth.current.event_context
                local dread = wesnoth.units.get(ctx.x1, ctx.y1)
                local target = wesnoth.units.get(ctx.x2, ctx.y2)
                if not (dread and target) then return end
                -- Pick the target's melee weapon with the highest expected damage against the Dreadnought.
                local best, best_score, best_stats
                for i, a in ipairs(target.attacks) do
                    if a.range == "melee" then
                        local _, _, tw = wesnoth.simulate_combat(target, i, dread)
                        local score = tw.damage * tw.num_blows * tw.chance_to_hit
                        if not best or score > best_score then best, best_score, best_stats = a, score, tw end
                    end
                end
                if not best then return end
                for _ = 1, best_stats.num_blows do
                    local hit = mathx.random(1, 100) <= best_stats.chance_to_hit
                    wml.fire("animate_unit", {
                        flag = "attack", hits = hit,
                        wml.tag.filter { x = target.x, y = target.y },
                        wml.tag.primary_attack { name = best.name },
                        wml.tag.facing { x = dread.x, y = dread.y },
                        wml.tag.animate {
                            flag = "defend", hits = hit,
                            wml.tag.filter { x = dread.x, y = dread.y },
                            wml.tag.primary_attack { name = best.name },
                            wml.tag.facing { x = target.x, y = target.y },
                        },
                    })
                    if hit then
                        wml.fire("harm_unit", {
                            wml.tag.filter { x = dread.x, y = dread.y },
                            wml.tag.filter_second { x = target.x, y = target.y },
                            amount = best_stats.damage, animate = false, kill = true, fire_event = true,
                        })
                        if not wesnoth.units.get(ctx.x1, ctx.y1) then return end
                    end
                end
            >>
        [/lua]
    [/event]

    # Machine: the Dreadnought has no crew and never gains experience.
    [event]
        name=attack end
        id=dw_machine_no_xp
        first_time_only=no
        [lua]
            code=<<
                for _, u in ipairs(wesnoth.units.find_on_map{ ability = "dw_machine" }) do
                    u.experience = 0
                end
            >>
        [/lua]
    [/event]

    # Ketracel-dependent: Jem'Hadar ships get no rest repair. This runs before the engine's
    # healing at the start of the side's turn, so clearing the resting flag skips the +2.
    [event]
        name=side turn
        id=dw_ketracel_dependent
        first_time_only=no
        [lua]
            code=<<
                for _, u in ipairs(wesnoth.units.find_on_map{ side = wesnoth.current.side, ability = "dw_ketracel_dependent" }) do
                    u.resting = false
                end
            >>
        [/lua]
    [/event]
#enddef
